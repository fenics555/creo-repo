  - table: equations
    tableComment: "Математический слой: Уравнения и зависимости"
  - table: health
    tableComment: "Аналитический слой: Состояние здоровья моделей"
  - table: history
    tableComment: "Архивный слой: История версий"
  - table: changes
    tableComment: "Журнал изменений: Кто/Когда/Что"
  - table: family
    tableComment: "Семейный слой: Вариации модели"
  - table: graph_nodes
    tableComment: "Графовый слой: Узлы связей"
  - table: graph_edges
    tableComment: "Графовый слой: Ребра связей"
  - table: links
    tableComment: "Связи компонентов"
  - table: derived
    tableComment: "Производные модели"

viewpoints:
  - name: "Паспорт и геометрия"
    desc: "Основные данные моделей и их физика"
    tables:
      - snapshots
      - params
      - bodies
      - materials
      - master_mat
      - matrices
  - name: "Связи и состав"
    desc: "Структура сборок и фичеров"
    tables:
      - snapshots
      - components
      - features
      - drawing
      - family
  - name: "История и архив"
    desc: "Журналы и изменения"
    tables:
      - snapshots
      - history
      - changes
      - equations
  - name: "Граф и консоль"
    desc: "Топология связей"
    tables:
      - snapshots
      - graph_nodes
      - graph_edges
      - health
      - dimensions
      - dim_all
