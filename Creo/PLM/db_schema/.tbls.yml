  - table: materials
    tableComment: "Материальный слой: Свойства материалов"
  - table: master_mat
    tableComment: "Справочник материалов: Эталонные значения"
  - table: matrices
    tableComment: "Математический слой: Матрицы трансформации"
  - table: components
    tableComment: "Составной слой: Дерево сборки и компонентов"
  - table: drawing
